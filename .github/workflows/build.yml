name: Xcode - Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: |
          xcodebuild \
            -project RuinaExtractor.xcodeproj \
            -scheme RuinaExtractor \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RuinaExtractor.app Payload/
          zip -qr RuinaExtractor-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: RuinaExtractor-unsigned-ipa
          path: RuinaExtractor-unsigned.ipa
